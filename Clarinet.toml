[project]
name = "gilt"
description = "Fixed-rate yield on stSTX, with a principal and yield split engine"
authors = []
telemetry = false
cache_dir = "./.cache"

# Mainnet requirements. These use older Clarity versions that Clarinet can
# resolve.
#
# StackingDAO's v4 data contracts (data-stx-v2, data-stbtc-v1) are Clarity 6
# and cannot be pulled in as requirements, so the two rate adapters that read
# them live in contracts/mainnet/ and are left out of this manifest. They are
# exercised by scripts/fork-check.sh, which runs Clarinet-fork.toml with
# [repl.remote_data], and the live published rates are checked by
# scripts/verify-mainnet-rates.sh. See docs/MAINNET-VERIFICATION.md.
[[project.requirements]]
contract_id = "SP3FBR2AGK5H9QBDH3EEN6DF8EK8JY7RX8QJ5SVTE.sip-010-trait-ft-standard"

[[project.requirements]]
contract_id = "SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG.ststx-token"

[[project.requirements]]
contract_id = "SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG.ststxbtc-token"

[[project.requirements]]
contract_id = "SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG.ststxbtc-token-v2"

[contracts.rate-source-trait]
path = "contracts/rate-source-trait.clar"
clarity_version = 3
epoch = "3.1"

[contracts.mock-rate-source]
path = "contracts/mock-rate-source.clar"
clarity_version = 3
epoch = "3.1"

[contracts.mock-rate-source-2]
path = "contracts/mock-rate-source-2.clar"
clarity_version = 3
epoch = "3.1"

[contracts.mock-ststx]
path = "contracts/mock-ststx.clar"
clarity_version = 3
epoch = "3.1"

[contracts.pt-token]
path = "contracts/pt-token.clar"
clarity_version = 3
epoch = "3.1"

[contracts.yt-token]
path = "contracts/yt-token.clar"
clarity_version = 3
epoch = "3.1"

[contracts.gilt-series]
path = "contracts/gilt-series.clar"
clarity_version = 3
epoch = "3.1"

[contracts.gilt-vault]
path = "contracts/gilt-vault.clar"
clarity_version = 3
epoch = "3.1"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }
