# Forked-mainnet manifest.
#
# Runs Gilt's real rate adapters against StackingDAO's mainnet contracts, at
# the block pinned by initial_height so results are reproducible. remote_data
# reads the Clarity 6 data contracts at runtime -- the only way to reach them,
# since they cannot be pulled in as static requirements at any epoch.
# scripts/fork-check.sh runs this manifest in a scratch directory so it never
# shares a deployment plan with the unit tests.
[project]
name = "gilt-fork"
description = "Gilt rate adapters against forked mainnet"
authors = []
telemetry = false
cache_dir = "./.cache"

[contracts.rate-source-trait]
path = "contracts/rate-source-trait.clar"
clarity_version = 3
epoch = "3.1"

[contracts.stackingdao-rate-source]
path = "contracts/mainnet/stackingdao-rate-source.clar"
clarity_version = 3
epoch = "3.1"

[contracts.stbtc-rate-source]
path = "contracts/mainnet/stbtc-rate-source.clar"
clarity_version = 3
epoch = "3.1"

[repl.remote_data]
enabled = true
api_url = "https://api.hiro.so"
initial_height = 8895400
